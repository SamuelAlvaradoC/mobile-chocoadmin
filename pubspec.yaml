name: chocoadmin
description: ChocAdmin - App móvil de ChocoFreseo
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.7.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # HTTP & Auth
  http: ^1.2.0
  shared_preferences: ^2.2.3

  # Navigation
  go_router: ^13.2.0

  # State Management
  provider: ^6.1.2

  # UI
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  flutter_svg: ^2.0.10+1
  shimmer: ^3.0.0

  # Utils
  intl: ^0.19.0
  fluttertoast: ^8.2.5
  flutter_spinkit: ^5.2.1
  url_launcher: ^6.3.0
  image_picker: ^1.1.2

  # Maps (geocerca — igual que React Leaflet)
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  socket_io_client: ^3.1.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.13.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icons/logo.png"
  adaptive_icon_background: "#FFFFFF"
  adaptive_icon_foreground: "assets/icons/logo.png"

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/icons/
